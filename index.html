<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Health Log</title>
  <meta name="description" content="Private, offline food, bowel and symptom journal.">
  <meta name="theme-color" content="#0f766e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Health Log">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-512.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top noprint">
    <button id="back" class="iconbtn" aria-label="Back" hidden>‹</button>
    <h1 id="title"></h1>
    <button id="gear" class="iconbtn" aria-label="Settings">⚙︎</button>
  </header>
  <main id="main" class="main"></main>
  <nav id="tabs" class="tabs noprint" aria-label="Sections"></nav>
  <div id="sheet" class="sheet" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="analysis.js"></script>
</body>
</html>
